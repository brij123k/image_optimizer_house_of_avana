# Host name: 206-81-12-41.sslip.io (points to the server's IP). When you get your own domain, change it here and re-run certbot.
server {
    listen 80;
    server_name 206-81-12-41.sslip.io;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OVERWRITE (not append) so a visitor cannot fake their IP address in the history page:
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
